<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Site Personnel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bienvenue sur mon site</h1>
    <nav>
      <ul>
        <li><a href="#about">À propos</a></li>
        <li><a href="#projects">Projets</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section id="about">
    <h2>À propos de moi</h2>
    <p>Je suis développeur web passionné par HTML, CSS et JavaScript.</p>
  </section>

  <section id="projects">
    <h2>Projets</h2>
    <div class="card" id="project1">
      <h3>Projet 1</h3>
      <p>Description de mon projet.</p>
      <button class="toggle-btn">En savoir plus</button>
      <p class="details hidden">Voici plus de détails sur le projet !</p>
    </div>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <form id="contactForm">
      <label for="email">Email :</label>
      <input type="email" id="email" required>
      <button type="submit">Envoyer</button>
    </form>
  </section>

  <script src="index.js"></script>
</body>
</html>
